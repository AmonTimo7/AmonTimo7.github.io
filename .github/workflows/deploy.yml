name: Publicar landing no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; se você empurrar dois commits seguidos, o último vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # O arquivo de design continua sendo a única fonte de verdade.
      # Aqui ele só é copiado como index.html (o nome com espaço não vira URL boa).
      - name: Montar o site
        run: |
          mkdir -p _site
          cp "project/ACTech Landing.dc.html" _site/index.html
          cp project/support.js _site/support.js
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
